<section class="mylist-page" id="mylist-page-root">
  <header class="mylist-header">
    <div class="mylist-tabs" id="mylist-tab-bar">
      <button class="mylist-tab active" type="button" data-subtab="history">History</button>
      <button class="mylist-tab" type="button" data-subtab="following">Following</button>
    </div>
  </header>

  <div class="mylist-body">
    <!-- Tab 1: History (Dynamic Sync from storage) -->
    <div class="mylist-tab-pane active" id="pane-history">
      <div class="mylist-drama-list" id="history-drama-list"></div>
    </div>

    <!-- Tab 2: Following -->
    <div class="mylist-tab-pane" id="pane-following">
      <div class="mylist-drama-list" id="following-drama-list">
        <div class="mylist-empty-state">
          <span class="empty-icon">★</span>
          <p class="empty-text">No followed series yet. Tap Collect on any drama to add it here!</p>
          <button class="btn-spotlight-play" type="button" data-route="/">Browse Dramas</button>
        </div>
      </div>
    </div>
  </div>
</section>

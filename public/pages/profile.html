<section class="profile-page" id="profile-page-root">
  <div class="db-profile-scroll-body">
    
    <!-- Top Ambient User Header (Unboxed, DramaBox Pattern) -->
    <header class="db-profile-header">
      <div class="db-user-left">
        <div class="db-avatar-wrap" id="profile-avatar-badge">
          <img 
            src="/icons/icon-animated.svg" 
            alt="Minsplay Ant" 
            class="db-avatar-img"
            onerror="this.onerror=null; this.src='/icons/icon-192.png';"
          />
          <span class="profile-vip-crown" id="profile-vip-crown" style="display: none;">👑</span>
        </div>
        
        <div class="db-user-meta">
          <h2 class="db-username">Minsplay Viewer</h2>
          <div class="db-user-subline">
            <span class="db-id-text">ID: <strong id="profile-member-id">84920</strong> 📋</span>
            <span class="db-sub-divider">|</span>
            <span class="db-following-text">Following 3</span>
          </div>
        </div>
      </div>

      <!-- Top Right Actions: Minimal DramaBox SVG Outline Icons -->
      <div class="db-top-actions">
        <button class="db-icon-btn" type="button" aria-label="Notifications" data-route="/inbox">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </button>
        <button class="db-icon-btn" type="button" aria-label="Settings" data-route="/settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Full-Width DramaBox VIP Card (Pink-to-Coral Gradient) -->
    <section class="db-vip-banner-card" data-route="/member">
      <span class="db-vip-discount-tag">Save 30%</span>
      <div class="db-vip-top-row">
        <div class="db-vip-copy">
          <h3 class="db-vip-heading" id="profile-vip-summary">Unlock VIP Pass</h3>
          <p class="db-vip-subtext">Enjoy these exclusive benefits:</p>
        </div>
        <button class="db-vip-action-btn" type="button" data-route="/member">
          Upgrade 👑
        </button>
      </div>

      <div class="db-vip-benefits-grid">
        <div class="db-benefit-col">
          <span class="db-benefit-symbol">🎬</span>
          <span class="db-benefit-label">9+ Series</span>
        </div>
        <div class="db-benefit-col">
          <span class="db-benefit-symbol">⚡</span>
          <span class="db-benefit-label">Daily Coins</span>
        </div>
        <div class="db-benefit-col">
          <span class="db-benefit-symbol">🚫</span>
          <span class="db-benefit-label">Zero Ads</span>
        </div>
        <div class="db-benefit-col">
          <span class="db-benefit-symbol">HD</span>
          <span class="db-benefit-label">1080p Quality</span>
        </div>
      </div>
    </section>

    <!-- Main Navigation Shelf (DramaBox Grouped Menu) -->
    <section class="db-menu-group">
      <article class="db-menu-row" data-route="/member">
        <span class="db-row-title">My Wallet</span>
        <div class="db-row-right">
          <span class="db-coin-indicator">🪙 <strong id="profile-coin-balance">50</strong></span>
          <span class="db-chevron">›</span>
        </div>
      </article>

      <article class="db-menu-row" id="btn-profile-checkin">
        <span class="db-row-title">Daily Gift Rewards</span>
        <div class="db-row-right">
          <span class="db-streak-indicator" id="profile-streak-count">Day 1 🔥</span>
          <span class="db-chevron">›</span>
        </div>
      </article>

      <article class="db-menu-row" data-route="/mylist">
        <span class="db-row-title">Watch History</span>
        <div class="db-row-right">
          <span class="db-history-counter" id="profile-history-count">3 In Progress</span>
          <span class="db-chevron">›</span>
        </div>
      </article>

      <article class="db-menu-row" data-route="/member">
        <span class="db-row-title">VIP Pass & Perks</span>
        <div class="db-row-right">
          <span class="db-chevron">›</span>
        </div>
      </article>
    </section>

    <!-- Standalone App Info Footer -->
    <footer class="db-profile-footer">
      <p class="db-version-pill">Minsplay Standalone • Build 2026</p>
    </footer>

  </div>
</section>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-animated.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0a0a0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Minsplay" />

    <title>Minsplay - Short Drama Streaming</title>

    <style>
      html, body {
        background-color: #000000;
        color: #ffffff;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      #main-content {
        min-height: 100vh;
      }
    </style>

    <link rel="stylesheet" href="./public/css/variables.css" />
    <link rel="stylesheet" href="./public/css/components.css" />
    <link rel="stylesheet" href="./public/css/pages.css" />
  </head>
  <body>

    <!-- Floating In-App Install Notification Banner -->
    <aside class="pwa-install-banner" id="pwa-install-banner" style="display: none;">
      <div class="pwa-banner-left">
        <div class="pwa-banner-mascot-wrap">
          <img src="/icons/icon-animated.svg" alt="Minsplay Ant" class="pwa-banner-mascot" />
        </div>
        <div class="pwa-banner-text">
          <strong>Install Minsplay App</strong>
          <span>Add to home screen for full immersion</span>
        </div>
      </div>
      <div class="pwa-banner-actions">
        <button class="btn-pwa-install" id="pwa-install-btn" type="button">Install</button>
        <button class="btn-pwa-dismiss" id="pwa-dismiss-btn" type="button" aria-label="Dismiss">✕</button>
      </div>
    </aside>

    <!-- Dynamic SPA Route Outlet -->
    <main id="main-content"></main>

    <!-- Authentic DramaBox 5-Tab Fixed Bottom Navigation -->
    <nav class="bottom-nav" id="bottom-nav">
      
      <!-- 1. Home -->
      <button class="nav-item active" type="button" data-route="/" aria-label="Home">
        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span class="nav-label">Home</span>
      </button>

      <!-- 2. For You (Phase 3 Infinite Discovery Feed) -->
      <button class="nav-item" type="button" data-route="/foryou" aria-label="For You">
        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="3"></rect>
          <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
        </svg>
        <span class="nav-label">For You</span>
      </button>

      <!-- 3. Member -->
      <button class="nav-item" type="button" data-route="/member" aria-label="Member">
        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <polygon points="12 6 13.8 9.6 17.8 10.2 14.9 13 15.6 17 12 15.1 8.4 17 9.1 13 6.2 10.2 10.2 9.6 12 6" fill="currentColor"></polygon>
        </svg>
        <span class="nav-label">Member</span>
      </button>

      <!-- 4. My List -->
      <button class="nav-item" type="button" data-route="/mylist" aria-label="My List">
        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="nav-label">My List</span>
      </button>

      <!-- 5. Profile -->
      <button class="nav-item" type="button" data-route="/profile" aria-label="Profile">
        <svg class="nav-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="nav-label">Profile</span>
      </button>

    </nav>

    <script type="module" src="./public/js/app.js"></script>
  </body>
</html>

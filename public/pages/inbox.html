<section class="db-subpage" id="inbox-page-root">
  <div class="db-subpage-body">
    
    <header class="db-subpage-header">
      <button class="db-back-btn" type="button" data-route="/profile" aria-label="Back">‹</button>
      <h2 class="db-subpage-title">My Inbox</h2>
      <div class="db-header-spacer"></div>
    </header>

    <div class="db-inbox-list">
      <!-- Row 1: My Activity -->
      <article class="db-inbox-row" id="btn-inbox-activity" data-route="/mylist">
        <div class="db-inbox-left">
          <div class="db-inbox-icon-circle purple">
            <span class="db-inbox-emoji">💬</span>
          </div>
          <div class="db-inbox-meta">
            <strong class="db-inbox-title">My Activity</strong>
            <span class="db-inbox-subtitle">My Comments & Reactions</span>
          </div>
        </div>
        <span class="db-chevron">›</span>
      </article>

      <!-- Row 2: Interactions -->
      <article class="db-inbox-row" id="btn-inbox-interactions">
        <div class="db-inbox-left">
          <div class="db-inbox-icon-circle blue">
            <span class="db-inbox-emoji">🔔</span>
          </div>
          <div class="db-inbox-meta">
            <strong class="db-inbox-title">Interactions</strong>
            <span class="db-inbox-subtitle">Replies and reactions to my comments</span>
          </div>
        </div>
        <span class="db-chevron">›</span>
      </article>
    </div>

  </div>
</section>

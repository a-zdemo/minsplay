<section class="watch-page">
  <div class="watch-container">

    <!-- Top Floating Navigation -->
    <header class="watch-nav">
      <button class="watch-back-btn" type="button" data-route="/series" aria-label="Back to Series">
        ←
      </button>
      <div class="watch-meta">
        <span class="watch-series-name">The Beginning</span>
        <span class="watch-ep-name" id="watch-ep-name">Episode 1</span>
      </div>
    </header>

    <!-- Video Stage / Viewport -->
    <section class="watch-page">
  <div class="watch-container">

    <!-- Top Floating Navigation -->
    <header class="watch-nav">
      <button class="watch-back-btn" type="button" data-route="/series" aria-label="Back to Series">
        ←
      </button>
      <div class="watch-meta">
        <span class="watch-series-name">The Beginning</span>
        <span class="watch-ep-name" id="watch-ep-name">Episode 1</span>
      </div>
    </header>

    <!-- Video Stage / Viewport -->
    <div class="video-stage">
      <video
        id="minsplay-video"
        class="video-player"
        playsinline
        preload="auto"
        controls
        src=""
      >
        Your browser does not support HTML5 video.
      </video>

      <!-- On-Screen Status Indicator -->
      <div id="video-status-msg" style="position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.75); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; z-index: 6; display: none;"></div>

      <!-- Custom Touch Play/Pause Overlay Indicator -->
      <div class="video-touch-overlay" id="video-touch-overlay">
        <button class="video-play-toggle" id="video-play-toggle" type="button" aria-label="Play or Pause">
          ▶
        </button>
      </div>

      <!-- Lock Modal Overlay -->
      <div class="video-lock-overlay" id="video-lock-overlay" style="display: none;">
        <div class="lock-modal-card">
          <span class="lock-icon">🔒</span>
          <h3 class="lock-title">Episode Locked</h3>
          <p class="lock-desc">Complete a quick action to unlock and continue watching.</p>
          <button class="btn btn-unlock" id="btn-unlock-mock" type="button">
            🎁 Watch Short Ad to Unlock (Mock)
          </button>
          <button class="btn btn-secondary" type="button" data-route="/series">
            Back to Episodes
          </button>
        </div>
      </div>
    </div>

    <!-- Quick Episode Navigation & Controls -->
    <div class="watch-details-sheet">
      <div class="watch-title-row">
        <div>
          <h2 class="watch-current-title" id="watch-current-title">Episode 1: The Encounter</h2>
          <p class="watch-current-tags">Urban • Drama • Complete</p>
        </div>
        <button class="btn-icon-fav" type="button" aria-label="Favorite">
          ♥
        </button>
      </div>

      <!-- Episode Switcher Strip -->
      <div class="watch-episode-strip">
        <span class="strip-label">Episodes:</span>
        <div class="strip-buttons" id="watch-episode-list">
          <button class="strip-ep-btn active" data-episode="1" type="button">1</button>
          <button class="strip-ep-btn" data-episode="2" type="button">2</button>
          <button class="strip-ep-btn locked" data-episode="3" type="button">3 🔒</button>
          <button class="strip-ep-btn locked" data-episode="4" type="button">4 🔒</button>
          <button class="strip-ep-btn locked" data-episode="5" type="button">5 🔒</button>
        </div>
      </div>

      <!-- Bottom Playback Actions -->
      <div class="watch-actions-row">
        <button class="btn btn-nav-ep" id="btn-prev-ep" type="button" disabled>
          ⏮ Previous
        </button>
        <button class="btn btn-nav-ep" id="btn-next-ep" type="button">
          Next Episode ⏭
        </button>
      </div>
    </div>

  </div>
</section>

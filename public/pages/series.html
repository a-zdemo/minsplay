
<section class="series-page" id="series-page-root">
  <div class="page-container">
    
    <!-- Top Back Navigation -->
    <header class="series-nav">
      <button class="nav-back-btn" id="series-back-btn" type="button" data-route="/" aria-label="Go Back">
        ← Back
      </button>
      <span class="nav-title" id="series-nav-title">Series Details</span>
    </header>

    <!-- Series Hero Banner / Info (Rendered dynamically) -->
    <div class="series-hero">
      <div class="series-hero-poster" id="series-hero-poster">
        <span id="series-hero-art-symbol">⚔️</span>
      </div>
      
      <div class="series-hero-meta">
        <span class="badge badge-accent" id="series-badge">Popular</span>
        <h1 class="series-title" id="series-title">The Beginning</h1>
        <p class="series-tags" id="series-tags">Urban • Suspense • Counterattack</p>
        <p class="series-stats" id="series-stats">5 Episodes • 14.2M Plays</p>
      </div>
    </div>

    <!-- Synopsis -->
    <div class="series-synopsis">
      <p id="series-synopsis">
        Loading series synopsis...
      </p>
    </div>

    <!-- Primary CTA: Starts Watching Ep 1 of Current Series -->
    <div class="series-cta">
      <button class="btn btn-primary" id="btn-series-start-watch" type="button" data-route="/watch" data-series="the-beginning" data-episode="1">
        ▶ Start Watching Ep 1
      </button>
    </div>

    <!-- Episodes Section (Dynamic render per Section 24) -->
    <div class="episodes-container">
      <div class="episodes-header">
        <h2 class="section-title">Episodes</h2>
        <span class="episode-count-pill" id="series-episode-count">5 Total</span>
      </div>

      <div class="episode-list" id="series-episode-list">
        <!-- Rendered dynamically by router.js -->
      </div>
    </div>

  </div>
</section>

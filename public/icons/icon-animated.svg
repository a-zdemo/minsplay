<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%"> <defs> <!-- Background Circle Radial Gradient --> <radialGradient id="badgeGlow" cx="50%" cy="40%" r="55%"> <stop offset="0%" stop-color="#ffffff"/> <stop offset="85%" stop-color="#f2f2f7"/> <stop offset="100%" stop-color="#e0e0ea"/> </radialGradient>
<!-- Hot Pink Play Button Gradient --> <linearGradient id="pinkBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%"> <stop offset="0%" stop-color="#ff4a7d"/> <stop offset="50%" stop-color="#ff2e63"/> <stop offset="100%" stop-color="#e01248"/> </linearGradient>
<!-- Ant Gloss Gradient --> <linearGradient id="antGloss" x1="20%" y1="0%" x2="80%" y2="100%"> <stop offset="0%" stop-color="#3a3a46"/> <stop offset="45%" stop-color="#1c1c24"/> <stop offset="100%" stop-color="#0a0a0f"/> </linearGradient>
<!-- Head Highlight --> <radialGradient id="headHighlight" cx="35%" cy="30%" r="60%"> <stop offset="0%" stop-color="#4d4d5c"/> <stop offset="60%" stop-color="#1c1c24"/> <stop offset="100%" stop-color="#0b0b10"/> </radialGradient>
<!-- Button Drop Glow Filter --> <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%"> <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ff2e63" flood-opacity="0.38"/> </filter>
<style> /* Ant Bobbing & Marching Animation */ @keyframes antCarry { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(-1deg); } }
/* Antennae Twitching */ @keyframes antennaLeft { 0%, 100% { transform: rotate(0deg); } 35% { transform: rotate(-5deg); } 70% { transform: rotate(3deg); } }
@keyframes antennaRight { 0%, 100% { transform: rotate(0deg); } 45% { transform: rotate(6deg); } 80% { transform: rotate(-4deg); } }
/* Button Glow & Pulse */ @keyframes buttonPulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 6px 10px rgba(255, 46, 99, 0.35)); } 50% { transform: scale(1.025); filter: drop-shadow(0 10px 18px rgba(255, 46, 99, 0.55)); } }
/* Ground Shadow Sync */ @keyframes shadowBreath { 0%, 100% { transform: scale(1); opacity: 0.28; } 50% { transform: scale(0.92); opacity: 0.18; } }
.ant-body-group { animation: antCarry 2.4s ease-in-out infinite; transform-origin: 256px 360px; }
.antenna-l { animation: antennaLeft 3s ease-in-out infinite; transform-origin: 290px 190px; }
.antenna-r { animation: antennaRight 2.8s ease-in-out infinite; transform-origin: 300px 190px; }
.pink-button-group { animation: buttonPulse 2.4s ease-in-out infinite; transform-origin: 375px 210px; }
.shadow-oval { animation: shadowBreath 2.4s ease-in-out infinite; transform-origin: 256px 395px; } </style> </defs>
<!-- Outer Disc Badge --> <circle cx="256" cy="256" r="236" fill="url(#badgeGlow)" stroke="#ffffff" stroke-width="8"/> <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
<!-- Ground Contact Shadow --> <ellipse class="shadow-oval" cx="256" cy="396" rx="140" ry="18" fill="#12121c"/>
<!-- Ant & Button Carrying Hierarchy --> <g class="ant-body-group">
<!-- Hind Legs (Behind Body) --> <path d="M 175 320 Q 140 340 125 385" stroke="#1c1c24" stroke-width="11" stroke-linecap="round" fill="none"/> <path d="M 235 295 Q 210 335 210 388" stroke="#1c1c24" stroke-width="10" stroke-linecap="round" fill="none"/> <path d="M 260 290 Q 285 335 300 386" stroke="#1c1c24" stroke-width="9" stroke-linecap="round" fill="none"/>
<!-- Ant Abdomen (Posterior segment) --> <ellipse cx="160" cy="310" rx="64" ry="48" transform="rotate(-24 160 310)" fill="url(#antGloss)"/> <!-- Abdomen Segment Highlight Rings --> <path d="M 145 272 Q 170 305 155 352" stroke="rgba(255,255,255,0.12)" stroke-width="4" fill="none"/> <path d="M 175 278 Q 200 305 185 344" stroke="rgba(255,255,255,0.14)" stroke-width="4" fill="none"/>
<!-- Ant Thorax (Center segment) --> <ellipse cx="238" cy="285" rx="38" ry="30" transform="rotate(-15 238 285)" fill="url(#antGloss)"/>
<!-- Neck Connector --> <path d="M 262 270 Q 282 258 290 248" stroke="#1c1c24" stroke-width="14" stroke-linecap="round" fill="none"/>
<!-- Ant Head --> <ellipse cx="304" cy="225" rx="36" ry="32" transform="rotate(-18 304 225)" fill="url(#headHighlight)"/>
<!-- Expressive Glossy Eye --> <ellipse cx="318" cy="214" rx="10" ry="12" fill="#0d0d12"/> <ellipse cx="320" cy="211" rx="4" ry="5" fill="#ffffff"/> <circle cx="315" cy="219" r="1.8" fill="#ffffff" opacity="0.8"/>
<!-- Left Antenna --> <g class="antenna-l"> <path d="M 292 198 Q 275 160 262 138" stroke="#1c1c24" stroke-width="6" stroke-linecap="round" fill="none"/> <circle cx="260" cy="136" r="4.5" fill="#1c1c24"/> </g>
<!-- Right Antenna --> <g class="antenna-r"> <path d="M 306 195 Q 312 155 330 134" stroke="#1c1c24" stroke-width="6" stroke-linecap="round" fill="none"/> <circle cx="332" cy="132" r="4.5" fill="#1c1c24"/> </g>
<!-- Mandible / Pincer (Detail) --> <path d="M 334 238 Q 345 245 336 254" stroke="#1c1c24" stroke-width="5" stroke-linecap="round" fill="none"/>
<!-- Front Carrying Arms (Reaching and holding up the Play Button) --> <path d="M 252 280 Q 295 260 325 248" stroke="#1c1c24" stroke-width="11" stroke-linecap="round" fill="none"/> <path d="M 325 248 L 358 234" stroke="#1c1c24" stroke-width="10" stroke-linecap="round" fill="none"/> <!-- Paw / Claws clasping button base --> <path d="M 354 228 Q 365 234 358 244" stroke="#1c1c24" stroke-width="5" stroke-linecap="round" fill="none"/>
<!-- Hot Pink Play Button (Carried Overhead) --> <g class="pink-button-group" filter="url(#pinkGlow)"> <!-- Main Rounded Tile --> <rect x="312" y="148" width="132" height="124" rx="26" fill="url(#pinkBtnGrad)"/>
<!-- Inner Subtle Border --> <rect x="313" y="149" width="130" height="122" rx="25" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
<!-- Button Top Gloss Highlight --> <path d="M 324 154 Q 378 162 432 154" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round" fill="none"/>
<!-- Play Glyph (▶) --> <polygon points="346,188 346,232 384,210" fill="#ffffff"/>
<!-- Pause Glyph Bars (❚❚) --> <rect x="396" y="188" width="8" height="44" rx="3.5" fill="#ffffff"/> <rect x="412" y="188" width="8" height="44" rx="3.5" fill="#ffffff"/> </g>
<!-- Foreground Foreleg (Stepping forward on ground) --> <path d="M 258 296 Q 275 342 278 392" stroke="#1c1c24" stroke-width="11" stroke-linecap="round" fill="none"/> <path d="M 195 315 Q 180 348 165 390" stroke="#1c1c24" stroke-width="10" stroke-linecap="round" fill="none"/>
</g> </svg>

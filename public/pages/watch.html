<!-- STREAMING_CHUNK:Structuring clean top HUD and fullbleed video stage... -->
<section class="watch-page fullbleed-player" id="watch-page-root">
  
  <!-- 100dvh Video Stage -->
  <div class="video-stage" id="video-stage">
    <div class="video-gesture-surface" id="video-gesture-surface"></div>
    <video
      id="minsplay-video"
      class="video-player fullbleed-video"
      playsinline
      webkit-playsinline
      preload="auto"
      src=""
    ></video>

    <!-- Subtitle Cue Rendering Overlay -->
    <div class="subtitles-overlay" id="subtitles-overlay">
      <span class="subtitles-cue" id="subtitles-cue" style="display: none;"></span>
    </div>

    <div id="hud-status-pill" class="video-status-badge"></div>

    <!-- Center Play/Pause Bubble -->
    <div class="center-play-indicator" id="center-play-indicator">
      <div class="center-icon-bubble">▶</div>
    </div>
  </div>

  <!-- Top Floating Auto-Dimming HUD: Clean & Uncluttered -->
  <header class="watch-hud-top" id="hud-top">
    <div class="watch-hud-left">
      <button class="hud-circle-btn" id="watch-back-btn" type="button" data-route="/series" aria-label="Back">‹</button>
      <div class="watch-hud-meta">
        <span class="hud-series-title">Protecting My Daughter</span>
        <span class="watch-ep-subline" id="watch-ep-badge">Episode 1</span>
      </div>
    </div>

    <!-- Unified 3-Button Controls (Speed, CC, Sound) -->
    <div class="watch-top-actions">
      <button class="hud-pill-btn btn-speed-toggle" id="btn-speed-toggle" type="button" aria-label="Playback Speed">1.0x</button>
      <button class="hud-pill-btn btn-cc-toggle active" id="btn-cc-toggle" type="button" aria-label="Subtitles">CC</button>
      <button class="hud-circle-btn" id="btn-sound-toggle" type="button" aria-label="Sound">🔊</button>
    </div>
  </header>

  <!-- Right Floating Action Rail -->
  <aside class="watch-hud-right" id="hud-right">
    <button class="rail-action-btn" id="btn-action-like" type="button">
      <span class="rail-btn-icon">♥</span>
      <span class="rail-btn-label" id="like-counter">14.2K</span>
    </button>
    <button class="rail-action-btn" id="btn-action-fav" type="button">
      <span class="rail-btn-icon">★</span>
      <span class="rail-btn-label" id="fav-label">Collect</span>
    </button>
    <button class="rail-action-btn" id="btn-action-comment" type="button">
      <span class="rail-btn-icon">💬</span>
      <span class="rail-btn-label" id="comment-counter">0</span>
    </button>
    <button class="rail-action-btn" id="btn-action-share" type="button">
      <span class="rail-btn-icon">↗</span>
      <span class="rail-btn-label">Share</span>
    </button>
    <button class="rail-action-btn" id="btn-open-drawer" type="button">
      <span class="rail-btn-icon">☰</span>
      <span class="rail-btn-label" id="episodes-drawer-label">5 Eps</span>
    </button>
  </aside>

  <!-- Bottom Floating HUD (Titles & Scrubber) -->
  <footer class="watch-hud-bottom" id="hud-bottom">
    <div class="hud-bottom-info">
      <h2 class="hud-bottom-title hud-series-title">Protecting My Daughter</h2>
      <p class="hud-bottom-sub" id="watch-current-title">Episode 1</p>
    </div>
    <div class="hud-scrubber-row">
      <span class="video-time" id="hud-time-current">0:00</span>
      <div class="hud-slider-wrap">
        <input type="range" id="video-seek" class="hud-seek-slider" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
      </div>
      <span class="video-time" id="hud-time-duration">0:10</span>
    </div>
  </footer>

  <!-- Centered Episode Lock Gate Modal -->
  <aside class="watch-lock-modal" id="watch-lock-modal" style="display: none;">
    <div class="lock-modal-dialog">
      <div class="lock-glow-ring"><span class="lock-big-emoji">🔒</span></div>
      <h3 class="lock-modal-title">Episode Locked</h3>
      <p class="lock-modal-desc">Unlock Episode <span id="locked-ep-number">3</span> to continue:</p>
      <div class="lock-modal-actions">
        <button class="btn-unlock-coins" id="btn-unlock-coins" type="button">
          <span>🪙 Unlock (30 Coins)</span>
          <span class="lock-coin-tag" id="lock-modal-coin-balance">50 Avail</span>
        </button>
        <button class="btn-unlock-gradient" id="btn-unlock-admob" type="button">
          🎬 Watch Ad to Unlock Free
        </button>
        <button class="btn-ghost-drawer" id="btn-lock-open-drawer" type="button">
          Choose Another Episode
        </button>
      </div>
    </div>
  </aside>

  

  <!-- Episode Drawer Sheet -->
  <aside class="drawer-modal-backdrop" id="drawer-backdrop" style="display: none;">
    <div class="drawer-sheet-box" id="drawer-sheet">
      <div class="drawer-drag-pill"></div>
      <header class="drawer-header">
        <div>
          <h3 class="drawer-heading hud-series-title">Protecting My Daughter</h3>
          <p class="drawer-subheading">Select Episode</p>
        </div>
        <button class="drawer-close-btn" id="drawer-close-btn" type="button">✕</button>
      </header>
      <div class="drawer-ep-grid" id="drawer-episode-grid"></div>
    </div>
  </aside>

  <!-- Subtitles Selection Drawer -->
  <aside class="subtitles-modal-backdrop" id="subtitles-modal-backdrop" style="display: none;">
    <div class="subtitles-sheet">
      <div class="subtitles-drag-pill"></div>
      <header class="subtitles-sheet-header">
        <h3 class="subtitles-heading">Subtitles & Captions</h3>
        <button class="subtitles-close-btn" id="btn-close-subtitles-modal" type="button">✕</button>
      </header>
      <div class="subtitles-options-list">
        <article class="sub-lang-option" data-lang="en">
          <div class="sub-lang-left"><span class="sub-lang-flag">🇬🇧</span><strong class="sub-lang-name">English</strong></div>
          <span class="sub-lang-radio">✓</span>
        </article>
        <article class="sub-lang-option" data-lang="es">
          <div class="sub-lang-left"><span class="sub-lang-flag">🇪🇸</span><strong class="sub-lang-name">Español</strong></div>
          <span class="sub-lang-radio"></span>
        </article>
        <article class="sub-lang-option" data-lang="id">
          <div class="sub-lang-left"><span class="sub-lang-flag">🇮🇩</span><strong class="sub-lang-name">Bahasa Indonesia</strong></div>
          <span class="sub-lang-radio"></span>
        </article>
        <article class="sub-lang-option" data-lang="off">
          <div class="sub-lang-left"><span class="sub-lang-flag">🚫</span><strong class="sub-lang-name">Off</strong></div>
          <span class="sub-lang-radio"></span>
        </article>
      </div>
    </div>
  </aside>

</section>

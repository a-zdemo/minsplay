<section class="auth-page-root" id="auth-page-root">
  <div class="auth-page-container">
    
    <header class="auth-page-header">
      <div class="auth-logo-badge"><span class="auth-logo-icon">🎬</span></div>
      <h1 class="auth-brand-heading">Minsplay</h1>
      <p class="auth-brand-sub">Stream & Create High-Octane Vertical Short Dramas</p>
    </header>

    <!-- Tab Switcher: Sign In vs Sign Up -->
    <nav class="auth-mode-tabs" id="auth-mode-tabs">
      <button class="auth-tab-btn active" id="tab-btn-signin" type="button" data-mode="signin">Sign In</button>
      <button class="auth-tab-btn" id="tab-btn-signup" type="button" data-mode="signup">Create Account</button>
    </nav>

    <!-- FORM A: Sign In -->
    <form class="auth-form-body active" id="form-signin" onsubmit="return false;">
      <div class="auth-field-group">
        <label class="auth-field-label" for="signin-email">Email Address</label>
        <div class="auth-input-container">
          <span class="auth-field-icon">✉</span>
          <input type="email" id="signin-email" class="auth-text-input" placeholder="name@minsplay.com" value="creator@minsplay.com" required />
        </div>
      </div>

      <div class="auth-field-group">
        <label class="auth-field-label" for="signin-password">Password</label>
        <div class="auth-input-container">
          <span class="auth-field-icon">🔒</span>
          <input type="password" id="signin-password" class="auth-text-input" placeholder="••••••••" value="demo1234" required />
        </div>
      </div>

      <button class="btn-auth-submit" id="btn-submit-signin" type="button">
        Sign In to Minsplay ➔
      </button>
    </form>

    <!-- FORM B: Sign Up (Register) -->
    <form class="auth-form-body" id="form-signup" style="display: none;" onsubmit="return false;">
      <div class="auth-field-group">
        <label class="auth-field-label" for="signup-username">Creator / Display Name</label>
        <div class="auth-input-container">
          <span class="auth-field-icon">👤</span>
          <input type="text" id="signup-username" class="auth-text-input" placeholder="e.g. DarkBeesStudio" required />
        </div>
      </div>

      <div class="auth-field-group">
        <label class="auth-field-label" for="signup-email">Email Address</label>
        <div class="auth-input-container">
          <span class="auth-field-icon">✉</span>
          <input type="email" id="signup-email" class="auth-text-input" placeholder="you@studio.com" required />
        </div>
      </div>

      <div class="auth-field-group">
        <label class="auth-field-label" for="signup-password">Create Password</label>
        <div class="auth-input-container">
          <span class="auth-field-icon">🔒</span>
          <input type="password" id="signup-password" class="auth-text-input" placeholder="At least 6 characters" required />
        </div>
      </div>

      <div class="auth-field-group">
        <label class="auth-field-label">Account Privilege Tier</label>
        <div class="auth-role-select-grid" id="signup-role-picker">
          <button class="role-chip active" type="button" data-role="user">
            <strong>Viewer 👤</strong>
            <small>Watch & Binge</small>
          </button>
          <button class="role-chip" type="button" data-role="creator">
            <strong>Creator 🎬</strong>
            <small>Upload & Monetize</small>
          </button>
        </div>
      </div>

      <button class="btn-auth-submit signup" id="btn-submit-signup" type="button">
        Create Account & Get 50 Coins 🎁
      </button>
    </form>

    <!-- Quick Role Switcher for Development & Testing -->
    <aside class="auth-demo-section">
      <div class="auth-demo-divider"><span>OR 1-TAP DEMO LOGIN</span></div>
      <div class="auth-demo-grid">
        <button class="btn-demo-preset" type="button" data-demo="creator">🎬 Verified Creator</button>
        <button class="btn-demo-preset" type="button" data-demo="super_admin">👑 Super Admin</button>
        <button class="btn-demo-preset" type="button" data-demo="admin">🛡️ Content Admin</button>
        <button class="btn-demo-preset" type="button" data-demo="user">👤 Standard Viewer</button>
      </div>
    </aside>

  </div>
</section>

<section class="auth-page-root db-auth-page" id="auth-page-root">
  <div class="db-auth-container">
    
    <!-- Top Back Arrow -->
    <header class="db-auth-nav">
      <button class="db-back-btn" type="button" data-route="/profile" aria-label="Back">‹</button>
    </header>

    <!-- Centered Brand Block -->
    <div class="db-auth-brand-center">
      <div class="db-auth-logo-box">
        <span class="db-auth-play-symbol">▶</span>
      </div>
      <h1 class="db-auth-title">Minsplay</h1>
    </div>

    <!-- Social Sign In Stack -->
    <div class="db-auth-buttons-stack">
      <!-- Clean Facebook Button (Badge Removed) -->
      <div class="db-social-btn-wrap">
        <button class="btn-db-social facebook" id="btn-auth-facebook" type="button">
          <span class="db-social-icon fb-icon">f</span>
          <span class="db-social-text">Sign in with Facebook</span>
        </button>
      </div>

      <!-- Google Button -->
      <div class="db-social-btn-wrap">
        <button class="btn-db-social google" id="btn-auth-google" type="button">
          <svg class="db-social-icon google-svg" viewBox="0 0 24 24" width="22" height="22">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.14z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.13C3.25 21.37 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.6H1.26C.46 8.21 0 10.05 0 12s.46 3.79 1.26 5.4l4.02-3.13z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.25 2.63 1.26 6.6l4.02 3.13c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span class="db-social-text">Sign in with Google</span>
        </button>
      </div>
    </div>

    <!-- Legal Terms Notice -->
    <footer class="db-auth-terms-footer">
      <p class="db-auth-terms-text">
        By continuing, you agree to our <span class="db-legal-link" data-route="/terms" style="cursor:pointer;text-decoration:underline;">Terms of Use</span> & <span class="db-legal-link" data-route="/privacy" style="cursor:pointer;text-decoration:underline;">Privacy Policy</span>.
      </p>
    </footer>

  </div>
</section>
